name: APK 빌드

# 릴리스할 때만 빌드: 커밋 메시지에 [release]가 있거나 직접 실행할 때.
# 풀 리퀘스트로는 실행되지 않음(외부인이 Secrets를 쓸 수 없게).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 꺼내기 (GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: 글꼴 받기
        run: |
          mkdir -p app/src/main/assets/fonts
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google/fonts.git gf
          git -C gf sparse-checkout set ofl/nanumgothic ofl/nanummyeongjo ofl/gowundodum
          pick() {
            f=$(ls gf/ofl/$1/ 2>/dev/null | grep -E -- "$2" | head -1)
            if [ -n "$f" ]; then cp "gf/ofl/$1/$f" "app/src/main/assets/fonts/$3"; echo "글꼴: $f -> $3"; else echo "없음: $1 $2"; fi
          }
          pick nanumgothic '-Regular\.ttf$' nanumgothic.ttf
          pick nanumgothic '-Bold\.ttf$' nanumgothic_bold.ttf
          pick nanummyeongjo '-Regular\.ttf$' nanummyeongjo.ttf
          pick nanummyeongjo '-Bold\.ttf$' nanummyeongjo_bold.ttf
          pick gowundodum '-Regular\.ttf$' gowundodum.ttf
          ls -la app/src/main/assets/fonts
          rm -rf gf

      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CommunityScrap-v0.1.${{ github.run_number }}.apk

      - name: 릴리스 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 커뮤 모아 v0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
